name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: core (linux)
    runs-on: ubuntu-24.04
    container: swift:6.2
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: swift test
        run: swift test

  macos:
    name: app + gates (macos)
    runs-on: macos-14
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - name: install tools
        run: brew install swiftlint swiftformat gitleaks
      - name: make ci
        run: make ci
